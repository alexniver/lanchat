[package]
name = "lanchat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
libc = "0.2"
mdns-sd = "0.11"
sha2 = "0.10"
base64 = "0.22"
ratatui = "0.29"
crossterm = "0.28"
whoami = "1"
hostname = "0.4"
