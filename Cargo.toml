[package]
name = "lanchat"
version = "0.1.9"
edition = "2021"
description = "A Helix-inspired, keyboard-first terminal chat client"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
mdns-sd = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
libc = "0.2"
zip = { version = "8.6", default-features = false }
dunce = "1"
unicode-width = "0.2"
base64 = "0.22"
arboard = { version = "3", default-features = false }
whoami = "1"
hostname = "0.4"

[dev-dependencies]
tempfile = "3"

[workspace]
exclude = ["old"]
